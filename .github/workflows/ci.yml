name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Matches the Dockerfile's build stage: AUTH_SECRET is only read at
          # runtime, so a placeholder is fine here too. No DATABASE_URL is
          # needed — prisma generate (above) doesn't touch a live DB, and the
          # build never queries one for this app's fully dynamic routes.
          AUTH_SECRET: build-time-placeholder
